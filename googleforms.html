<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>漫畫設計問卷</title>
  <style>
    :root{
      --bg-1: #f5fbff;
      --bg-2: #eef6ff;
      --text: #16223a;
      --muted: #5a6b86;
      --accent: #2f7fff;  
      --accent-2: #00d1c9; 

      --glass: rgba(255,255,255,.50);
      --glass-strong: rgba(255,255,255,.68);
      --border: rgba(255,255,255,.65);
      --border-2: rgba(21,32,51,.10);
      --ring: 0 0 0 4px rgba(47,127,255,.22);
      --radius: 20px;
      --shadow:
        0 26px 56px rgba(16, 30, 54, .16),
        0 8px 20px rgba(16, 30, 54, .10);
    }

    *{ box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, -apple-system, Segoe UI, Roboto, "Noto Sans TC", "PingFang TC", "Hiragino Sans", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(47,127,255,.25), transparent 60%),
        radial-gradient(900px 480px at 100% 0%, rgba(0,209,201,.20), transparent 60%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
      overflow-y:auto;
    }

    .ribbon{
      position: fixed; inset: -220px -220px auto auto;
      width: 560px; height: 560px; pointer-events:none; z-index: 0;
      background:
        radial-gradient(50% 50% at 50% 50%, rgba(255,255,255,.28), rgba(255,255,255,0) 70%),
        conic-gradient(from 210deg, rgba(47,127,255,.25), rgba(0,209,201,.22), rgba(47,127,255,.25));
      filter: blur(64px) saturate(140%);
      border-radius: 50%;
      animation: float 16s ease-in-out infinite alternate;
      opacity: .7;
    }
    @keyframes float{
      from { transform: translate(0,0) rotate(0deg) scale(1); }
      to   { transform: translate(-44px,-22px) rotate(8deg) scale(1.06); }
    }

    .wrap{ width: min(900px, 92vw); margin: 56px auto 96px; position: relative; z-index: 1; }

    .glass{
      position: relative;
      background:
        linear-gradient(145deg, var(--glass-strong), var(--glass)),
        linear-gradient(0deg, rgba(255,255,255,.06), rgba(255,255,255,.06));
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px) saturate(185%);
      -webkit-backdrop-filter: blur(24px) saturate(185%);
      padding: 26px 28px 30px;
      overflow: hidden;
      isolation: isolate;
    }
    .glass::before{
      content:"";
      position: absolute; inset: 0;
      border-radius: calc(var(--radius) + 1px);
      background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.10));
      mix-blend-mode: screen;
      opacity: .55;
      pointer-events: none;
    }
    .glass::after{
      content:"";
      position:absolute; top:-35%; left:-8%;
      width: 160%; height: 60%;
      background: linear-gradient(100deg, rgba(255,255,255,.65), rgba(255,255,255,0) 60%);
      transform: rotate(8deg);
      filter: blur(34px);
      opacity:.48;
      pointer-events:none;
    }

    h1{
      margin:0 0 6px 0;
      font-size: clamp(22px, 3.2vw, 30px);
      letter-spacing:.3px;
      font-weight: 900;
    }
    .subtitle{
      margin:0 0 14px 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .req-line{
      display:flex; align-items:center; gap:10px;
      margin: 10px 0 16px;
      color: var(--muted); font-size: 13px;
    }

    .subtitle,
    .req-line
    .badge {
    color: var(--text);
    position: relative;
    z-index: 2;
    }
    .badge{
      display:inline-block; padding: 4px 10px; border-radius: 999px;
      background: rgba(47,127,255,.12); color: var(--accent); font-weight: 800;
      border: 1px solid rgba(47,127,255,.28);
    }

    /* Form fields */
    label{ display:block; margin-top:16px; font-weight:800; font-size:14px; letter-spacing:.2px; }
    input[type="text"],
    textarea, select{
      width:100%; margin-top:8px; padding:12px 14px; font-size:15px;
      border-radius: 14px; outline:none; color: var(--text);
      background: rgba(255,255,255,.86);
      border: 1px solid var(--border-2);
      transition: box-shadow .2s, border-color .2s, transform .04s;
    }
    textarea{ resize: vertical; min-height: 96px; }
    input:focus, textarea:focus, select:focus{
      border-color: var(--accent);
      box-shadow: var(--ring);
    }

    /* Grid layout */
    .grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-1{ display:grid; grid-template-columns: 1fr; gap: 16px; }
    @media (max-width: 840px){ .grid{ grid-template-columns: 1fr; } }

    /* Chips */
    .chips{ display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
    .chip{
      display:inline-flex; align-items:center; gap:8px;
      padding: 9px 12px;
      background: rgba(255,255,255,.86);
      border: 1px solid var(--border-2);
      border-radius: 999px;
      font-size: 13px; font-weight: 800; color: var(--text);
      cursor: pointer; user-select: none;
      transition: transform .04s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .chip input{ transform: translateY(1px); }
    .chip:hover{ transform: translateY(-1px); }
    .chip.is-on{
      background: linear-gradient(90deg, rgba(47,127,255,.20), rgba(0,209,201,.20));
      border-color: rgba(47,127,255,.45);
      box-shadow: 0 6px 14px rgba(47,127,255,.20);
    }

    /* Actions */
    .actions{ margin-top:22px; display:flex; gap:12px; flex-wrap:wrap; }
    button{
      appearance:none; cursor:pointer; border:none;
      padding: 12px 16px; border-radius: 14px; font-weight:900; letter-spacing:.3px;
      transition: transform .04s ease, filter .15s ease, box-shadow .15s ease;
    }
    button:active{ transform: translateY(1px); }
    .btn-primary{
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
      box-shadow: 0 10px 24px rgba(47,127,255,.35), 0 6px 14px rgba(0,209,201,.22);
    }
    .btn-ghost{
      background: rgba(255,255,255,.80);
      border:1px solid var(--border-2);
      color: var(--text);
    }

    .section-title{
      margin-top: 22px; padding-top: 10px;
      font-weight: 900; font-size: 14px; letter-spacing:.3px;
      border-top: 1px solid rgba(255,255,255,.6);
    }
  </style>
</head>
<body>
  <div class="ribbon" aria-hidden="true"></div>

  <main class="wrap">
    <section class="glass" role="region" aria-label="漫畫設計問卷 表單">
      <h1>漫畫設計問卷</h1>
      <p class="subtitle">請填寫必要資訊。系統將自動生成四張具敘事連貫性的圖像、加入對白，並合成 2×2 漫畫。</p>
      <div class="req-line"><span>標示 * 之欄位為必填。</span></div>

      <form id="comicForm" novalidate>
        <!-- Basic -->
        <div class="grid">
          <div>
            <label for="title">故事標題 *</label>
            <input id="title" name="title" type="text" required />
          </div>
          <div>
            <label for="brand">品牌名稱 *</label>
            <input id="brand" name="brand" type="text" required />
          </div>
        </div>
        <div class="grid">
          <div>
            <label for="product">產品描述 *</label>
            <textarea id="product" name="product" required></textarea>
          </div>
          <div>
            <label for="audience_note">目標受眾（選填）</label>
            <input id="audience_note" name="audience_note" type="text" />
          </div>
        </div>

        <div class="section-title">偏好設定（選填）</div>
        <div class="grid">
          <div>
            <label for="theme">漫畫類型</label>
            <input id="theme" name="theme" type="text" />
          </div>
          <div>
            <label for="protagonist">主角描述</label>
            <input id="protagonist" name="protagonist" type="text" />
          </div>
        </div>

        <!-- Prompts & Speeches -->
        <div class="section-title">圖片提示詞與對白</div>
        <div class="grid">
          <div><label for="p1">第一張圖片的提示詞 *</label><input id="p1" name="p1" type="text" required /></div>
          <div><label for="s1">第一張圖片的對白（選填）</label><input id="s1" name="s1" type="text" /></div>
        </div>
        <div class="grid">
          <div><label for="p2">第二張圖片的提示詞 *</label><input id="p2" name="p2" type="text" required /></div>
          <div><label for="s2">第二張圖片的對白（選填）</label><input id="s2" name="s2" type="text" /></div>
        </div>
        <div class="grid">
          <div><label for="p3">第三張圖片的提示詞 *</label><input id="p3" name="p3" type="text" required /></div>
          <div><label for="s3">第三張圖片的對白（選填）</label><input id="s3" name="s3" type="text" /></div>
        </div>
        <div class="grid">
          <div><label for="p4">第四張圖片的提示詞 *</label><input id="p4" name="p4" type="text" required /></div>
          <div><label for="s4">第四張圖片的對白（選填）</label><input id="s4" name="s4" type="text" /></div>
        </div>

        <!-- Art style -->
        <div class="section-title">藝術風格</div>
        <label for="style">選擇風格 *</label>
        <select id="style" name="style" required>
          <option value="" selected disabled>請選擇</option>
          <option value="anime-inspired">動漫風格（Anime-inspired）</option>
          <option value="cartoon-inspired">卡通風格（Cartoon-inspired）</option>
          <option value="manga-ink">漫畫線稿（Manga / Ink）</option>
          <option value="cel-shaded">賽璐璐風格（Cel-shaded）</option>
          <option value="watercolor">水彩風格（Watercolor）</option>
          <option value="sketch-lineart">素描/線稿（Sketch / Lineart）</option>
        </select>

        <!-- Social -->
        <div class="section-title">社交媒體平台（自動發布）</div>
        <div class="chips" id="platformChips" role="group" aria-label="社交媒體平台">
          <label class="chip"><input type="checkbox" name="platforms" value="facebook" /> Facebook</label>
          <label class="chip"><input type="checkbox" name="platforms" value="instagram" /> Instagram</label>
          <label class="chip"><input type="checkbox" name="platforms" value="x" /> Twitter/X</label>
        </div>

        <label for="headline">社群貼文標題 *</label>
        <input id="headline" name="headline" type="text" required />

        <div class="actions">
          <button class="btn-primary" type="submit">送出</button>
          <button class="btn-ghost" type="reset">重設</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    const chipGroups = [document.getElementById('audienceChips'), document.getElementById('platformChips')];
    chipGroups.forEach(group => {
      if (!group) return;
      group.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('change', () => {
          chip.classList.toggle('is-on', chip.querySelector('input').checked);
        });
      });
    });

    const form = document.getElementById('comicForm');
    form.addEventListener('submit', (e) => {
      const requiredIds = ['title','brand','product','p1','p2','p3','p4','style','headline'];
      const invalid = [];
      requiredIds.forEach(id => {
        const el = document.getElementById(id);
        if (!el || !el.value || el.value.trim() === '') invalid.push(el);
      });
      const platforms = Array.from(document.querySelectorAll('input[name="platforms"]:checked'));
      if (platforms.length === 0) invalid.push(document.getElementById('platformChips'));

      if (invalid.length){
        e.preventDefault();
        const first = invalid.find(Boolean);
        if(first && first.scrollIntoView) first.scrollIntoView({behavior:'smooth', block:'center'});
        if(first && first.focus) first.focus({preventScroll:true});
        alert('請完成所有必填欄位，並至少選擇一個社交媒體平台。');
        return false;
      }

      e.preventDefault();
      alert('測試送出：尚未連接後端。可於此處以 fetch(...) 串接 N8N Webhook。');
    });
  </script>
</body>
</html>
